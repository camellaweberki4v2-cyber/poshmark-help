<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order update</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f4f5;
    color: #18181b;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border: 1px solid #e4e4e7;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 12px 36px rgba(15,23,42,.08);
    align-self: flex-start;
  }
  h1 { font-size: 24px; letter-spacing: -.5px; margin: 0 0 10px; }
  p.hint { margin: 0 0 8px; font-size: 13px; color: #71717a; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input, textarea {
    width: 100%;
    padding: 9px 11px;
    font: inherit;
    font-size: 14px;
    border: 1px solid #d4d4d8;
    border-radius: 6px;
    background: #fff;
    color: inherit;
  }
  input:focus, textarea:focus { outline: 2px solid #2563eb; outline-offset: -1px; border-color: #2563eb; }
  textarea { resize: vertical; min-height: 64px; }
  .to input { border-color: #2563eb; font-weight: 600; }
  .sep { border: 0; border-top: 1px solid #e4e4e7; margin: 22px 0 6px; }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 11px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #a1a1aa; cursor: not-allowed; }
  .msg { display: none; margin-top: 14px; padding: 11px 13px; border-radius: 6px; font-size: 14px; line-height: 1.5; }
  .msg.ok  { display: block; background: #dcfce7; color: #166534; }
  .msg.err { display: block; background: #fee2e2; color: #991b1b; }
  .msg a { color: inherit; }
  .extra { display: flex; gap: 8px; margin-top: 10px; }
  .extra input { flex: 1; min-width: 0; }
  .extra .ex-name { flex: 0 0 190px; }
  #addRow {
    margin-top: 14px;
    background: #f4f4f5;
    color: #3f3f46;
    border: 1px solid #d4d4d8;
    padding: 8px;
    font-size: 13px;
    font-weight: 500;
  }
  #addRow:hover { background: #e4e4e7; }
  button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
  @media (max-width: 480px) {
    body { padding: 20px 12px; }
    .card { padding: 22px 18px; }
    .extra { flex-direction: column; gap: 6px; margin-top: 16px; }
    .extra .ex-name { flex: auto; background: #f8fafc; }
    input { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="card">
  <h1>Order update</h1>
  <p class="hint">
    Первый раз на почту придёт письмо с ссылкой подтверждения —
    откройте её, дальше всё уйдёт сразу.
  </p>

  <form id="orderForm" novalidate>

    <div class="to">
      <label for="ccInput">CC 1 — копия письма (необязательно)</label>
      <input type="email" id="ccInput" placeholder="first@example.com">
      <label for="ccInput2">CC 2 — копия письма (необязательно)</label>
      <input type="email" id="ccInput2" placeholder="second@example.com">
      <label for="ccInput3">CC 3 — копия письма (необязательно)</label>
      <input type="email" id="ccInput3" placeholder="third@example.com">
    </div>

    <div class="to">
      <label for="subjectInput">Тема письма</label>
      <input type="text" id="subjectInput" name="_subject" value="Order update">
    </div>

    <hr class="sep">

    <!-- Шаблон письма: basic -->
    <input type="hidden" name="_template" value="basic">
    <!-- Куда перейти после отправки -->
    <input type="hidden" name="_next" value="https://formsubmit.co/thanks">

    <p class="hint">
      Слева — название столбца, справа — значение. Названия редактируйте сами.
      Пустые строки в письмо не попадают.
    </p>

    <div class="extra">
      <input type="text" class="ex-name" value="seller" placeholder="Название столбца">
      <input type="text" class="ex-value" placeholder="Значение">
    </div>
    <div class="extra">
      <input type="text" class="ex-name" value="order status" placeholder="Название столбца">
      <input type="text" class="ex-value" placeholder="Значение">
    </div>
    <div class="extra">
      <input type="text" class="ex-name" value="order link" placeholder="Название столбца">
      <input type="text" class="ex-value" placeholder="Значение">
    </div>
    <div class="extra">
      <input type="text" class="ex-name" value="use the portal above" placeholder="Название столбца">
      <input type="text" class="ex-value" placeholder="Значение">
    </div>
    <div class="extra">
      <input type="text" class="ex-name"  placeholder="Название столбца">
      <input type="text" class="ex-value" placeholder="Значение">
    </div>

    <button type="button" id="addRow">+ Добавить строку</button>

    <!-- honeypot: у человека остаётся пустым, бот заполняет -->
    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

    <button type="submit" id="sendBtn">Отправить письмо</button>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
</div>

<script>
(function () {
  var form     = document.getElementById('orderForm');
  var ccInputs = ['ccInput', 'ccInput2', 'ccInput3'].map(function (id) { return document.getElementById(id); });
  var btn      = document.getElementById('sendBtn');
  var msg      = document.getElementById('msg');

  // Почта получателя зашита в код — поле в форме убрано
  var TO = 'qaisraza4321khan@gmail.com';

  // Сколько строк таблицы создаётся по умолчанию (их возвращаем после отправки)
  var BASE_ROWS = form.querySelectorAll('.extra').length;

  // Запоминаем адрес CC, чтобы не вводить каждый раз
  var savedCc = localStorage.getItem('fs_cc');
  if (savedCc) savedCc.split(',').slice(0, 3).forEach(function (value, index) { ccInputs[index].value = value.trim(); });

  // ---- свои строки таблицы ----
  var addBtn = document.getElementById('addRow');

  function addRow() {
    var row = form.querySelector('.extra').cloneNode(true);
    row.querySelector('.ex-name').value  = '';
    row.querySelector('.ex-value').value = '';
    form.insertBefore(row, addBtn);
    row.querySelector('.ex-name').focus();
  }
  addBtn.addEventListener('click', addRow);

  function show(text, ok, link) {
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
    msg.textContent = text;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var to = TO;

    var addresses = [];
    for (var c = 0; c < ccInputs.length; c++) {
      var address = ccInputs[c].value.trim();
      if (address && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(address)) {
        show('Некорректный адрес в поле CC ' + (c + 1) + '.', false);
        ccInputs[c].focus();
        return;
      }
      if (address && addresses.indexOf(address) === -1) addresses.push(address);
    }
    var cc = addresses.join(',');

    // Собираем данные формы (кроме honeypot)
    var data = {};
    var honey = '';
    new FormData(form).forEach(function (value, key) {
      if (key === '_honey') { honey = value; return; }
      if (String(value).trim() === '') return;   // пустые поля не отправляем
      data[key] = String(value).trim();
    });

    // Копии письма — до трёх адресов
    if (cc) data._cc = cc;

    var filledRows = 0;
    // Дополнительные строки таблицы (вписываете слева название, справа значение)
    form.querySelectorAll('.extra').forEach(function (row) {
      var k = row.querySelector('.ex-name').value.trim();
      var v = row.querySelector('.ex-value').value.trim();
      if (!k || !v) return;
      data[k] = v;
      filledRows++;
    });

    if (filledRows === 0) {
      show('Заполните хотя бы одно поле.', false);
      return;
    }

    // Honeypot заполнен — значит бот, тихо выходим
    if (honey) { show('Письмо отправлено на ' + to + '.', true); return; }

    btn.disabled = true;
    btn.textContent = 'Отправка…';

    fetch('https://formsubmit.co/ajax/' + encodeURIComponent(to), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(data)
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.success === 'true' || res.success === true) {
          if (cc) localStorage.setItem('fs_cc', cc);
          show('Письмо отправлено на ' + to + (cc ? ', копия на ' + cc : '') + '.', true);

          // Запоминаем ваши названия столбцов, значения очищаем
          var names = [];
          form.querySelectorAll('.ex-name').forEach(function (n) { names.push(n.value); });

          var savedAddresses = ccInputs.map(function (input) { return input.value; });
          form.reset();
          ccInputs.forEach(function (input, index) { input.value = savedAddresses[index]; });

          // Убираем добавленные строки, оставляем исходные 5
          var rows = form.querySelectorAll('.extra');
          for (var i = rows.length - 1; i >= BASE_ROWS; i--) rows[i].remove();

          // Возвращаем названия столбцов, как вы их написали
          form.querySelectorAll('.ex-name').forEach(function (n, idx) {
            if (names[idx] !== undefined) n.value = names[idx];
          });
        } else {
          show('Ошибка: ' + (res.message || JSON.stringify(res)), false);
        }
      })
      .catch(function (err) {
        show('Не удалось отправить: ' + err.message, false);
      })
      .then(function () {
        btn.disabled = false;
        btn.textContent = 'Отправить письмо';
      });
  });
})();
</script>

</body>
</html>
